name: Supabase Keep-Alive

# NOTE: GitHub automatically disables scheduled workflows after 60 days with
# no repository activity (commits, PRs, etc). A gym running this app in
# production is unlikely to push commits, so do NOT rely on this workflow
# alone to keep Supabase from auto-pausing. Set up a free external monitor
# (UptimeRobot, cron-job.org, healthchecks.io) pinging /api/health every few
# hours instead - see TROUBLESHOOTING.md. This workflow is a bonus, not the
# safety net.

on:
  schedule:
    # Runs at 00:00 UTC every 3 days
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Ping Supabase REST API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/?apikey=${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
          -I
